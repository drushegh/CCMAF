version: 2

# NOTE (informational only): this repo's .github/workflows/close-prs.yml
# auto-closes PRs on `pull_request_target: types: [opened, reopened]`, but
# it exempts Dependabot explicitly (`if: github.event.pull_request.user.login
# != 'dependabot[bot]'`) — added in the same commit as this config (62bf6f2)
# — so PRs opened from this file are NOT auto-closed.

updates:
  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
