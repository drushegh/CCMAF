name: "CodeQL"

# JavaScript/TypeScript analysis over the repo's remaining JS surface — the
# tools/*.mjs Console driver + the framework's .mjs test harness. The Console app
# itself has its own repo + CodeQL now (drushegh/console); the rest of the
# framework is shell/python and out of scope for JS/TS analysis.

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # CodeQL code scanning is free ONLY on public repos; on a private repo it
    # needs GitHub Advanced Security (paid). Gate to public so a consumer who
    # clones this onto a private/free-tier account gets a SKIPPED (green) job,
    # not a perpetually-failing one. On a private repo WITH GHAS, remove this.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # No-op for pure JS/TS extraction (CodeQL parses source directly and
      # doesn't require a real compile), kept for parity with GitHub's
      # standard CodeQL workflow template.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
