# state-budgets.conf — per-state-file byte ceilings (OPT P3, TASK-139).
#
# doctor Check 16 stats each file below: >=80% of budget -> WARNING, >=100% ->
# CRITICAL. The finding NAMES the remediation (rotate-state.sh). It NEVER blocks
# the session — doctor findings surface via cold-start triage, and nothing at
# Stop checks size (fable: "enforce at boot, remediate at leisure").
#
# Derivation (not arbitrary — sol's caveat): each ceiling is the observed
# POST-rotation size x ~1.5 headroom, with TASKS' CRITICAL set BELOW the ~187KB
# point where the harness reported TASKS.md "too large to include".
# Round-1 (TASK-137) rotated TASKS + DECISIONS. Round-2 Phase 3 (TASK-133,
# 2026-07-13) rotated STATUS + progress, so their budgets are now tightened to
# defend the post-rotation sizes:
#   - STATUS.md: loaded IN FULL at every cold-start, and it grows fast (narrative
#     status each session), so the 1.5x-of-minimum rule under-sizes it. Instead the
#     ceiling is a cold-start-COST threshold: 30KB nudges rotation at 24KB (80%),
#     well before the ~64KB bloat cleaned in this round. (Post-rotation size ~5KB.)
#   - claude-progress.txt: only a SLICE is read at cold-start (Rolling Summary +
#     last 3 entries), so rotation is low cold-start value — generous headroom
#     (~1.65x the post-rotation ~181KB) to avoid nagging a working log.
# GOTCHAS is the live-landmine class (never age-rotated) — its budget is unchanged.
# Revisit against real token telemetry as the boot-view ships.
#
# Consumer override: create .claude/state-budgets.local.conf (gitignored) — if
# present it WINS over this shipped file (same pattern as healthcheck.conf).
#
# Format: <relative-path>=<max-bytes>   (blank lines and #comments ignored)
.claude/TASKS.md=150000
.claude/STATUS.md=30000
.claude/DECISIONS.md=110000
.claude/GOTCHAS.md=45000
.claude/claude-progress.txt=300000
