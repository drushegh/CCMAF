# state-budgets.conf — per-state-file byte ceilings (OPT P3, TASK-139).
#
# doctor Check 16 stats each file below: >=80% of budget -> WARNING, >=100% ->
# CRITICAL. The finding NAMES the remediation (rotate-state.sh). It NEVER blocks
# the session — doctor findings surface via cold-start triage, and nothing at
# Stop checks size (fable: "enforce at boot, remediate at leisure").
#
# Derivation (not arbitrary — sol's caveat): each ceiling is the observed
# POST-rotation size x ~1.5 headroom, with TASKS' CRITICAL set BELOW the ~187KB
# point where the harness reported TASKS.md "too large to include". This first
# pass is deliberately loose: only TASKS + DECISIONS were rotated (TASK-137);
# STATUS/GOTCHAS/progress are still current-size + headroom. Tighten as more
# rotation lands and the boot-view ships; revisit against real token telemetry.
#
# Consumer override: create .claude/state-budgets.local.conf (gitignored) — if
# present it WINS over this shipped file (same pattern as healthcheck.conf).
#
# Format: <relative-path>=<max-bytes>   (blank lines and #comments ignored)
.claude/TASKS.md=150000
.claude/STATUS.md=90000
.claude/DECISIONS.md=110000
.claude/GOTCHAS.md=45000
.claude/claude-progress.txt=450000
